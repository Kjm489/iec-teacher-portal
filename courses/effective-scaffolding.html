<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IEC Teacher Development Academy | Effective Scaffolding</title><style>:root{--navy:#142747;--maroon:#812d45;--pale:#eaf0f6;--ink:#233247;--line:#d7dce4;--green:#176b4a}*{box-sizing:border-box}body{margin:0;background:#f3f5f9;color:var(--ink);font:16px/1.55 Arial,Helvetica,sans-serif}header{background:var(--navy);color:white;border-bottom:6px solid var(--maroon);padding:20px max(20px,calc((100% - 1060px)/2))}.brand{font-size:13px;letter-spacing:.12em;font-weight:700}.headtitle{font-size:24px;font-weight:700;margin:5px 0}main{max-width:1060px;margin:24px auto;padding:0 18px 50px}.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:25px;margin-bottom:18px;box-shadow:0 3px 14px #14274709}h1,h2,h3{color:var(--navy);line-height:1.25}h1{font-size:31px}h2{font-size:25px}h3{font-size:19px}.muted{color:#58667a}.eyebrow{color:var(--maroon);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.button,button{font:inherit;cursor:pointer;border:1px solid var(--line);background:white;color:var(--navy);border-radius:9px;padding:12px 16px;font-weight:700}button:hover{border-color:var(--maroon);background:#faf5f7}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #a25b72;outline-offset:2px}.primary{background:var(--maroon);border-color:var(--maroon);color:white}.primary:hover{background:#682237;color:white}.nav{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.tile{padding:18px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left}.tile strong{display:block;font-size:18px}.tile small{display:block;color:#5a6778;margin-top:8px}.progress{height:11px;border-radius:20px;background:#dfe5ec;overflow:hidden}.bar{height:100%;background:var(--maroon);transition:width .25s}.pill{display:inline-block;background:var(--pale);border-radius:30px;padding:4px 10px;font-size:12px;font-weight:bold}.callout{border-left:5px solid var(--maroon);background:#f8f3f5;padding:15px 18px;border-radius:5px;margin:14px 0}.question{border:1px solid var(--line);padding:18px;border-radius:12px;margin:16px 0}.options{display:grid;gap:9px;margin-top:12px}.option{text-align:left;white-space:normal}.option.selected{border:2px solid var(--maroon);background:#faf2f5}.feedback{padding:13px 16px;border-radius:8px;margin-top:12px;background:#eaf5ef;border-left:5px solid var(--green)}.feedback.try{background:#fff4ed;border-color:#b45e30}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:15px 0}.step{background:var(--navy);color:white;border-radius:9px;padding:12px;text-align:center;font-weight:700;font-size:13px}.section{border-top:1px solid var(--line);margin-top:23px;padding-top:18px}.cardrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.strategy{text-align:left;min-height:90px}.strategy.active{background:#f8f0f3;border:2px solid var(--maroon)}.input{width:100%;padding:11px;border:1px solid #aeb8c5;border-radius:8px;font:inherit;margin:5px 0 12px}textarea.input{min-height:92px}.footer{font-size:12px;color:#657185;margin-top:22px}.score{font-size:48px;font-weight:800;color:var(--maroon)}.hidden{display:none!important}@media(max-width:640px){.steps{grid-template-columns:repeat(2,1fr)}h1{font-size:26px}.panel{padding:18px}header{padding:18px}}@media print{header,.nav,button,.no-print{display:none!important}body{background:white}.panel{box-shadow:none;border:0}main{margin:0;max-width:none}}</style></head><body><header><div class="brand">IEC · INTERNATIONAL PROGRAMS · TEACHER DEVELOPMENT ACADEMY</div><div class="headtitle">Module 01 — Effective Scaffolding (10 Lessons)</div><div>Learn It. Try It. Teach It.</div></header><main id="app" aria-live="polite"></main><script>
'use strict';const KEY='iec-scaffolding-course-v1';let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}let state={completed:saved.completed||[],practice:saved.practice||{},answers:{},screen:'home',lesson:0,step:0,finalAnswers:saved.finalAnswers||{},submitted:!!saved.submitted,score:saved.score||0,plan:saved.plan||{name:'',subject:'',strategy:'',evidence:''},selectedStrategy:'',order:[],date:saved.date||''};const app=document.getElementById('app');const lessons=['Understanding Scaffolding','Gradual Release & Modeling','The Scaffolding Toolkit','ICQs, CCQs & Assessment','Classroom Decision Simulator','Diagnosing Learning Barriers','Adaptive Scaffolding & Differentiation','Academic Language & Disciplinary Literacy','Formative Assessment & Feedback','Transfer, Independence & Lesson Design'];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(){try{localStorage.setItem(KEY,JSON.stringify({completed:state.completed,practice:state.practice,finalAnswers:state.finalAnswers,submitted:state.submitted,score:state.score,plan:state.plan,date:state.date}))}catch(e){}}function goHome(){state.screen='home';render()}function openLesson(n){state.screen='lesson';state.lesson=n;state.step=0;state.answers={};state.order=[];render()}function next(){const max=content[state.lesson].length;if(state.step<max-1){state.step++;state.answers={};state.order=[];render()}else{if(!state.completed.includes(state.lesson))state.completed.push(state.lesson);persist();goHome()}}function prev(){if(state.step>0){state.step--;state.answers={};state.order=[];render()}else goHome()}function answer(id,choice){state.answers[id]=choice;render()}function pickStrategy(k){state.selectedStrategy=k;render()}function markPractice(id,val){state.practice[id]=val;persist();render()}function selectOrder(i){if(!state.order.includes(i))state.order.push(i);render()}function clearOrder(){state.order=[];render()}function progress(){return Math.round(state.completed.length/10*100)}function chrome(body){app.innerHTML=body;window.scrollTo({top:0,behavior:'instant'})}function nav(){return `<div class="nav no-print"><button onclick="goHome()">⌂ Course home</button><span class="pill">${state.completed.length}/10 lessons completed</span></div>`}function home(){let tiles=lessons.map((t,i)=>`<button class="tile" onclick="openLesson(${i})"><span class="eyebrow">Lesson ${i+1} · ${i>=5?'12–16':i===4?'12':'8–10'} min</span><strong>${esc(t)}</strong><small>${state.completed.includes(i)?'✓ Completed — revisit anytime':'Open lesson →'}</small></button>`).join('');chrome(`<section class="panel"><div class="eyebrow">Individual professional learning · approx. 110–140 minutes</div><h1>Effective Scaffolding</h1><p>Welcome! Work independently through ten progressively challenging lessons. Make teaching decisions, receive immediate feedback, and finish with a practical strategy for your next class.</p><div class="progress" aria-label="Course progress"><div class="bar" style="width:${progress()}%"></div></div><p class="muted">${progress()}% of lessons completed. Progress is saved in this browser when local storage is available.</p><div class="nav"><button class="primary" onclick="openLesson(${state.completed.length<10?state.completed.length:0})">${state.completed.length===10?'Review lessons':'Start / continue learning'} →</button><button onclick="openFinal()">Final assessment ${state.completed.length===10?'':'(available anytime)'}</button></div></section><section class="panel"><h2>Your ten lessons</h2><div class="grid">${tiles}</div></section><section class="panel"><h3>How this works</h3><p>Read a short explanation, try an activity, then review feedback. You can return to any lesson. Practice is for learning; only the final 10-question assessment determines your knowledge score.</p><p class="footer">IEC internal professional development resource. Not an external accreditation or qualification.</p></section>`)}function q(id,title,options,correct,explain){const selected=state.answers[id];return `<div class="question"><h3>${title}</h3><div class="options">${options.map((o,i)=>`<button class="option ${selected===i?'selected':''}" onclick="answer('${id}',${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div>${selected!==undefined?`<div class="feedback ${selected===correct?'':'try'}"><strong>${selected===correct?'✓ Good decision!':'Consider this alternative.'}</strong><div>${explain}</div>${selected!==correct?'<p>Choose another answer if you would like to try again.</p>':''}</div>`:''}</div>`}function lessonPage(){const items=content[state.lesson],item=items[state.step];chrome(`${nav()}<section class="panel"><div class="eyebrow">Lesson ${state.lesson+1} of 10 · Screen ${state.step+1} of ${items.length}</div><h1>${esc(lessons[state.lesson])}</h1><div class="progress"><div class="bar" style="width:${(state.step+1)/items.length*100}%"></div></div><div class="section">${item()}</div><div class="nav section no-print"><button onclick="prev()">← Back</button><button class="primary" onclick="next()">${state.step===items.length-1?'Complete lesson ✓':'Continue →'}</button></div></section>`)}const strategies=[['Visual supports','Use a labeled water-cycle diagram to connect words with processes. Fade by removing labels.'],['Worked examples','Annotate each step of a solved equation and explain why it was chosen. Fade to a partial example.'],['Sentence frames','“The ___ causes ___ because ___.” Fade to keywords, then independent explanation.'],['Chunked instructions','Give three numbered steps instead of a dense paragraph. Fade prompts as routines become familiar.'],['Guided questioning','Ask “What do we know? What is missing? What could we try?” Reduce prompts as students take over.'],['Graphic organizers','Use a Venn diagram to compare processes. Later ask students to plan without it.']];function strategyCards(){return `<h2>Explore six teaching tools</h2><p>Click each card to see when to use it and how to fade it.</p><div class="cardrow">${strategies.map((s,i)=>`<button class="strategy ${state.selectedStrategy===String(i)?'active':''}" onclick="pickStrategy('${i}')">${s[0]}</button>`).join('')}</div>${state.selectedStrategy!==''?`<div class="callout"><strong>${strategies[+state.selectedStrategy][0]}</strong><p>${strategies[+state.selectedStrategy][1]}</p></div>`:''}`}
const content=[[
()=>`<h2>What is scaffolding?</h2><p>Scaffolding is <strong>temporary instructional support</strong> that helps a learner complete a task they cannot yet do independently. It relates to the Zone of Proximal Development: learning that becomes possible with appropriate help.</p><div class="steps"><div class="step">Demonstrate</div><div class="step">Guide</div><div class="step">Reduce prompts</div><div class="step">Check independence</div></div><div class="callout">The goal is not to make every task easier. It is to make challenging learning achievable while gradually building independence.</div>`,
()=>`<h2>See the difference</h2><div class="grid"><div class="callout"><strong>Without support</strong><p>“Write 150 words about your daily routine.” No model or planning support is offered.</p></div><div class="callout"><strong>With support</strong><p>Model a paragraph, highlight the topic sentence and details, guide an example, provide a sentence organizer, then gradually remove it.</p></div></div>${q('l1a','Which version is more likely to help developing writers?',['The unsupported task','The modeled and guided task','Both always work equally well'],1,'Modeling and language support make the structure visible, while independent writing remains the eventual goal.')}`,
()=>`${q('l1b','A Grade 8 class must explain how a water filter works in English, but students cannot start. What should the teacher try?',['Repeat the instruction more loudly','Model an explanation with a labeled diagram and vocabulary','Assign a longer written response'],1,'A demonstration, diagram, and language frame address both the conceptual and language demands of the task.')}${q('l1c','What is the ultimate purpose of scaffolding?',['Permanent teacher assistance','Independent student success','Removing difficult learning objectives'],1,'Support should be adjusted and eventually faded as students demonstrate readiness.')}`,
()=>`<h2>Choose one challenge from your classroom</h2><p>Which barrier do you see most often?</p><div class="cardrow">${[['instructions','Understanding instructions'],['concepts','Understanding concepts'],['independence','Working independently']].map(([k,v])=>`<button onclick="markPractice('barrier','${k}')">${v}</button>`).join('')}</div>${state.practice.barrier?`<div class="feedback"><strong>Try this:</strong> ${{instructions:'Model the first action, give numbered steps, and ask an ICQ.',concepts:'Use a worked example or visual, then ask a CCQ that requires explanation.',independence:'Fade full examples to partial prompts and use an independent exit ticket.'}[state.practice.barrier]}</div>`:''}<p>Remember this strategy when you design your final action plan.</p>`
],[
()=>`<h2>I do → We do → You do together → You do alone</h2><div class="steps"><div class="step">I DO<br><small>Think aloud</small></div><div class="step">WE DO<br><small>Guide</small></div><div class="step">TOGETHER<br><small>Rehearse</small></div><div class="step">ALONE<br><small>Demonstrate</small></div></div><p>The phases are flexible. If student responses show confusion, return to guided practice before releasing responsibility again.</p>`,
()=>`<h2>Watch the teacher's thinking</h2><div class="callout"><strong>Mathematics word problem</strong><p>“First, I underline <em>altogether</em> because it suggests combining quantities. Next, I identify the numbers. I choose addition because the question asks for the total.”</p></div><p>Modeling should reveal <strong>why</strong> a teacher takes each step, not merely show a finished answer.</p>${q('l2a','After modeling, what is the best next step?',['Immediately test everyone independently','Guide students through a similar problem','Move to an unrelated topic'],1,'Guided practice gives learners a supported attempt and allows the teacher to correct misunderstandings.')}`,
()=>`<h2>Put the steps in order</h2><p>Click the four actions in the order you would teach them. Use “Start again” to retry.</p>${['Students complete a paragraph independently','Teacher models a topic sentence','Students complete an example with teacher prompts','Students practice with a partner'].map((t,i)=>`<button style="display:block;width:100%;margin:7px 0;text-align:left;white-space:normal" ${state.order.includes(i)?'disabled':''} onclick="selectOrder(${i})">${t}</button>`).join('')}<p><strong>Your sequence:</strong> ${state.order.map(i=>['Independent','Model','Guided','Partner'][i]).join(' → ')||'Select your first action'}</p>${state.order.length===4?`<div class="feedback ${state.order.join(',')==='1,2,3,0'?'':'try'}">${state.order.join(',')==='1,2,3,0'?'✓ Correct: model → guided → partner → independent.':'Try again. Start with teacher modeling, then reduce support gradually.'}</div>`:''}<button onclick="clearOrder()">Start again</button>`,
()=>`<h2>Practice a teacher think-aloud</h2><p>Imagine teaching a paragraph. Read this model aloud:</p><div class="callout">“First, I choose a topic sentence. Notice that it tells the reader my main idea. I add a supporting detail because it explains my point. Now let's try a second sentence together.”</div>${q('l2b','Which phrase makes the teacher’s reasoning visible?',['“I add a supporting detail because it explains my point.”','“Write it now.”','“This is the answer.”'],0,'A think-aloud reveals the decision behind an action, which students can later apply independently.')}`
],[
()=>strategyCards(),
()=>`<h2>Match the barrier to the scaffold</h2>${q('l3a','Students cannot start after long instructions.',['Chunk the instructions into numbered steps','Add an unrelated vocabulary test','Remove all instructions'],0,'Chunking makes the immediate action manageable.')}${q('l3b','Students cannot organize an IELTS essay.',['Use a claim–reason–example organizer','Ask for a longer essay immediately','Give only a spelling list'],0,'A graphic organizer makes the structure of the response visible.')}${q('l3c','Students memorize a mathematics procedure without understanding its steps.',['Provide an annotated worked example','Give the final answer only','Skip the worked process'],0,'A worked example exposes the sequence and reasoning behind the solution.')}`,
()=>`<h2>Different support, same learning goal</h2><p><strong>Science objective:</strong> Explain why ice melts.</p><div class="grid"><div class="callout"><strong>Emerging English</strong><p>Picture-word bank: heat, ice, liquid. Support a simple explanation.</p></div><div class="callout"><strong>Developing English</strong><p>“Ice melts when ___ because ___.”</p></div><div class="callout"><strong>More advanced English</strong><p>Independent explanation using accurate scientific vocabulary.</p></div></div>${q('l3d','Which differentiation choice is best?',['Different unrelated objectives for each student','One core objective with appropriately varied support','Only the strongest students explain the science'],1,'Keep the core conceptual goal while varying the language and access supports.')}`,
()=>`<h2>Fade the support</h2><div class="steps"><div class="step">Full frame</div><div class="step">Partial frame</div><div class="step">Keywords</div><div class="step">Independent answer</div></div>${q('l3e','When should the teacher reduce support?',['On a fixed date regardless of student performance','When evidence shows students are ready to attempt more independently','Immediately after the first demonstration'],1,'Use evidence from student work, explanations, and checks for understanding. If performance deteriorates, restore appropriate support.')}`
],[
()=>`<h2>ICQs check instructions; CCQs check concepts</h2><div class="grid"><div class="callout"><strong>ICQ: What do I do?</strong><p>“Are you working alone or with a partner?”</p><p>“What will you submit?”</p></div><div class="callout"><strong>CCQ: What does it mean?</strong><p>“Does a conductor allow electricity to flow?”</p><p>“If the ratio is 2:3, which quantity is larger?”</p></div></div><p>“Do you understand?” does not provide reliable evidence of either.</p>`,
()=>`<h2>ICQ / CCQ quick-fire game</h2><p>Choose a classification for each question and receive immediate feedback.</p>${[['Are you working in pairs?','ICQ','It checks grouping.'],['Does evaporation involve liquid changing to gas?','CCQ','It checks the meaning of evaporation.'],['Do you understand?','Neither','It does not demonstrate comprehension.'],['How many minutes do you have?','ICQ','It checks the time instruction.'],['If a ratio is 2:3, which quantity is larger?','CCQ','It checks mathematical meaning.'],['What must you submit?','ICQ','It checks the expected output.'],['Is everyone ready?','Neither','It does not check a specific instruction or concept.'],['Is a whale a mammal? Why?','CCQ','It checks conceptual understanding.']].map(([t,a,e],i)=>q('icq'+i,`${i+1}. “${t}”`,['ICQ','CCQ','Neither'],['ICQ','CCQ','Neither'].indexOf(a),e)).join('')}`,
()=>`${q('l4a','Teacher: “Does everyone get the task?” Which replacement is better?',['“Is it clear?”','“What are you doing first?”','“Any questions?”'],1,'Ask for the first action so students demonstrate that they understand the task.')}${q('l4b','Students say they understand a graph. Which check is stronger?',['“Is the graph clear?”','“What does the x-axis represent?”','“Are you ready?”'],1,'A specific concept question gives evidence of understanding.')}`,
()=>`<h2>Use student responses to decide what happens next</h2><p>Use mini-whiteboards, response cards, exit tickets, or short independent tasks to collect evidence from more than one student.</p>${q('l4c','Most students answer the CCQ incorrectly. What should the teacher do?',['Move on because the lesson plan says so','Model the concept again, then recheck understanding','Assign a grade immediately'],1,'Formative assessment should inform instruction. Return to modeling or guided practice when students are not ready.')}`
],[
()=>`<h2>You are the teacher: Scenario 1</h2><p>Grade 8 students avoid answering an explanation question.</p>${q('sim1','What do you do?',['Call on students immediately','Provide thinking time, a sentence frame, and rehearsal','Answer the question yourself'],1,'Think time and language support reduce the barrier without removing the thinking task. Next, collect responses from everyone with mini-whiteboards.')}`,
()=>`<h2>Scenario 2: Mathematics language barrier</h2><p>Students calculate ratios correctly from numbers but struggle with English word problems.</p>${q('sim2','Your best first move?',['Reteach all arithmetic','Compare numeric and simplified-language versions','Remove word problems permanently'],1,'Compare performance to distinguish language difficulties from gaps in mathematical understanding.')}`,
()=>`<h2>Scenario 3: Science vocabulary</h2><p>Students recite “evaporation” and “condensation” but cannot explain why water droplets form.</p>${q('sim3','What should you try?',['More vocabulary recall quizzes','A cause-and-effect organizer with a “because” frame','Move on because pronunciation is correct'],1,'Students need to explain the relationship: “Droplets form because water vapor cools.”')}`,
()=>`<h2>Scenario 4: IELTS Speaking</h2><p>A learner answers “Do you enjoy cooking?” with “Yes, I do,” and stops.</p>${q('sim4','Which response helps the learner expand independently?',['Say “Speak longer”','Model answer–reason–example, then fade the frame','Skip to a harder speaking question'],1,'Use a full frame, then keywords, then a fresh prompt without the frame.')}`,
()=>`<h2>Scenario 5: Over-scaffolding</h2><p>Students can write paragraphs only by copying the teacher’s example.</p>${q('sim5','What is the best next step?',['Give another complete paragraph to copy','Replace the full model with a checklist and monitor work','Remove all support and test immediately'],1,'A checklist preserves success criteria while removing the completed answer. Check whether students can now produce their own work.')}`,
()=>`<h2>Your classroom takeaway</h2><p>Which issue would you most like to address in your next lesson?</p><div class="cardrow">${['Silent students','Language-heavy math','Science explanations','Short speaking answers','Dependence on examples'].map((v,i)=>`<button onclick="markPractice('simfocus','${i}')">${v}</button>`).join('')}</div>${state.practice.simfocus!==undefined?`<div class="feedback">${['Offer think time and sentence rehearsal, then collect every student’s answer.','Compare numeric and simplified-language versions before reteaching mathematics.','Use a cause-and-effect organizer and ask students to explain “because.”','Model answer–reason–example and gradually remove the frame.','Replace full examples with prompts or checklists and assess independence.'][+state.practice.simfocus]}</div>`:''}<p>Complete this lesson, then take the final assessment.</p>`
]
,[
()=>`<h2>Diagnose before you scaffold</h2><p>Students may fail a task because of a language barrier, an unfamiliar concept, weak retrieval, unclear directions, or excessive cognitive load. The same visible error can have different causes.</p><div class="callout"><strong>Diagnostic cycle:</strong> collect a small sample → compare performance across task conditions → identify the most likely barrier → select the least intrusive support → recheck.</div>${q('l6a','A learner solves fraction calculations accurately but fails word problems. Which first diagnostic comparison gives the most useful evidence?',['Provide a fully worked solution to every word problem and compare grades','Compare equivalent numerical and language-rich tasks, then probe interpretation of the question','Repeat the arithmetic demonstration before gathering evidence'],1,'A controlled comparison helps separate mathematical understanding from language comprehension before intervention.')}`,
()=>`<h2>Disentangle task demands</h2><p>Grade 7 students can label parts of a plant but cannot explain photosynthesis in English. Ask students to arrange picture cards, explain orally with prompts, and write independently. Compare what each mode reveals.</p>${q('l6b','Students sequence picture cards correctly and explain orally using everyday language but cannot produce the written scientific explanation. What is the strongest inference?',['The science concept is entirely absent','The task primarily exposes a disciplinary language and writing demand','The students require a lower science objective'],1,'The cross-mode evidence suggests conceptual access is stronger than the written academic language performance.')}`,
()=>`<h2>Choose evidence, not assumptions</h2>${q('l6c','Three students give the same wrong answer to a ratio question. Which action best identifies whether the error is conceptual?',['Ask each student to explain their representation and test a contrasting ratio example','Give all three a sentence frame immediately','Mark the answers incorrect and move to the next question'],0,'Eliciting reasoning and using a contrasting example distinguishes misconceptions from slips or language problems.')}${q('l6d','A learner hesitates before answering. What is the most defensible interpretation?',['Hesitation proves insufficient content knowledge','Hesitation proves a language-processing problem','Hesitation alone is insufficient; vary wait time and response mode to gather evidence'],2,'Behavioral evidence is ambiguous without further diagnostic checks.')}`,
()=>`<h2>Apply the diagnostic cycle</h2><p>Choose a barrier you have observed and plan one quick comparison for your next class.</p><div class="callout">Example: Compare a science explanation with labeled diagrams versus the same explanation without labels. Observe whether the support improves conceptual reasoning or merely reproduces vocabulary.</div>${q('l6e','Which diagnostic approach minimizes the risk of unnecessary long-term scaffolding?',['Select support from a quick hypothesis, verify its impact, then fade it as evidence permits','Provide all students with maximum support for the entire unit','Wait for the end-of-term exam before adjusting instruction'],0,'Responsive scaffolding is based on tested hypotheses and repeated evidence, not permanent assumptions.')}`
],[
()=>`<h2>Differentiate access without diluting challenge</h2><p>A common learning objective can be reached through different entry points: visuals, vocabulary banks, worked examples, structured rehearsal, and strategic peer support. The challenge is to avoid giving some learners the thinking itself.</p>${q('l7a','In a mixed-proficiency science class, which differentiation most closely preserves a shared reasoning objective?',['Require emerging English learners to copy definitions while others explain causes','Use a common cause-and-effect question, varying vocabulary and response scaffolds by demonstrated need','Give the strongest students all the higher-order questions'],1,'The conceptual demand remains shared while language support is differentiated.')}`,
()=>`<h2>Calibrate the amount of help</h2><p>Two learners use the same sentence frame. One explains accurately without it on a new example; the other cannot begin without prompts. Their next tasks should not be identical.</p>${q('l7b','What is the most evidence-responsive next step?',['Fade the first learner’s frame and retain targeted prompts for the second, then reassess both','Remove both frames to ensure fairness','Keep both frames until the entire class is ready'],0,'Equity means responsive access to the same goal, not identical support regardless of readiness.')}`,
()=>`<h2>When support becomes interference</h2>${q('l7c','A teacher provides a fully written model for every speaking task. Learners perform fluently when reading but struggle with new prompts. What should change?',['Increase the number of memorized scripts','Switch to prompt keywords, rehearsal, and unfamiliar transfer questions','Avoid independent speaking until scripts are perfected'],1,'Scripts may inflate apparent performance while suppressing generative language use.')}${q('l7d','During pair work, one partner always supplies the other’s answers. Which adjustment best tests independent understanding?',['Keep pairs intact because both appear successful','Provide private think time and individual response evidence before partner comparison','Remove all collaborative activities from the unit'],1,'Individual evidence distinguishes supported performance from independent mastery.')}`,
()=>`<h2>Design a fading rule</h2><p>Specify a performance indicator that triggers reduced support, such as two accurate independent explanations on different examples, rather than an arbitrary calendar date.</p>${q('l7e','Which fading criterion is most defensible?',['After exactly ten minutes of guided practice','When learners demonstrate the target process independently on varied tasks','Once the teacher has presented all slides'],1,'Fading should follow observed readiness and transfer across examples.')}`
],[
()=>`<h2>Scaffold language and thinking together</h2><p>Content learning requires language functions such as compare, justify, predict, infer, and evaluate. A scaffold should make the language function visible while leaving the disciplinary reasoning to the learner.</p>${q('l8a','Students must justify a historical interpretation. Which support best preserves argument quality?',['Supply a complete paragraph for copying','Offer claim–evidence–reasoning prompts and two conflicting sources','Replace interpretation with vocabulary matching'],1,'A reasoning structure supports disciplinary argument without supplying the conclusion.')}`,
()=>`<h2>From vocabulary to explanation</h2><p>Knowing words such as evaporation, condensation, and precipitation does not guarantee the ability to explain the water cycle. Move from labels to causal relationships.</p>${q('l8b','Students accurately define “condensation” but cannot explain droplets on a cold glass. Which next task best reveals conceptual transfer?',['Repeat a definition quiz with more terms','Ask learners to predict and explain droplet formation in a new setting using a diagram','Provide a polished paragraph to memorize'],1,'Novel causal explanation tests whether learners can apply the concept beyond word recognition.')}`,
()=>`<h2>Reading and listening as meaning-making</h2>${q('l8c','Before an academic listening task, learners lack essential background knowledge. What is the best pre-listening scaffold?',['Preteach every word and give the full transcript','Activate the core concept, preteach a few indispensable terms, and set a purposeful gist task','Play the audio repeatedly without a listening goal'],1,'Selective preparation reduces unnecessary load while preserving authentic listening and inference.')}${q('l8d','A reading task asks students to infer an author’s position. Which prompt is most useful?',['Which exact sentence should you copy?','Which two textual clues support your inference, and what alternative reading did you reject?','Can you pronounce every unfamiliar word?'],1,'Evidence and alternatives make inferential reasoning observable.')}`,
()=>`<h2>Move beyond sentence frames</h2><p>Progress from a complete frame to cue words, then to an independent explanation using appropriate disciplinary vocabulary.</p>${q('l8e','Which response most convincingly demonstrates that a language scaffold can be faded?',['The learner repeats the teacher’s sentence accurately','The learner explains a new example accurately without the frame','The learner completes a fill-in-the-blank exercise with the frame visible'],1,'Independent transfer is stronger evidence than accurate reproduction of supported language.')}`
],[
()=>`<h2>Formative checks that change instruction</h2><p>A check for understanding is useful when it informs a decision. Collect responses from all learners, examine error patterns, and decide whether to reteach, regroup, extend, or fade support.</p>${q('l9a','After guided practice, 70% answer correctly but the remaining errors share a specific misconception. What is the best response?',['Reteach the entire lesson identically to everyone','Address the misconception with a contrasting example and recheck, while extending learners already secure','Ignore the errors because most students passed'],1,'Targeted feedback and reassessment preserve momentum while addressing a shared misconception.')}`,
()=>`<h2>Feedback: actionable and transferable</h2><p>Effective feedback identifies the gap and provides a next move, but does not always supply the answer. Match the feedback to the learning goal and learner readiness.</p>${q('l9b','A student writes a clear claim but provides irrelevant evidence. Which feedback best promotes revision?',['“Good job—add more.”','“Check whether each example actually supports your claim; replace one and explain the link.”','Rewrite the entire response for the student'],1,'The feedback names a specific reasoning gap and asks the student to repair it.')}`,
()=>`<h2>Distinguish performance from mastery</h2>${q('l9c','Students achieve 95% accuracy while following a worked example. What can the teacher conclude?',['The concept is mastered independently','The scaffold supports performance, but independent transfer still needs checking','All scaffolds should now be removed permanently'],1,'Supported accuracy is valuable evidence, but not sufficient proof of independent mastery.')}${q('l9d','A student gets an answer correct but cannot justify the method. What next?',['Assume the answer proves full understanding','Ask for a comparison or explanation that reveals the underlying reasoning','Give the student an advanced worksheet without discussion'],1,'Reasoning checks distinguish secure understanding from guessing or procedural imitation.')}`,
()=>`<h2>Plan an evidence-based next move</h2><p>Choose a quick check (mini-whiteboards, exit ticket, independent explanation), anticipate two likely errors, and decide in advance what each pattern would mean for tomorrow’s lesson.</p>${q('l9e','Which evidence best supports fading a worked example?',['High participation during teacher explanation','Successful independent solution of a novel problem with an explanation of reasoning','Accurate copying of the modeled steps'],1,'Novel independent performance provides stronger transfer evidence than engagement or copying.')}`
],[
()=>`<h2>Design for independent transfer</h2><p>Scaffolding succeeds when learners can apply the target skill to unfamiliar tasks without the original prompts. Plan transfer checks at the outset, not only after teaching.</p>${q('l10a','After a supported persuasive-writing lesson, which follow-up best tests transfer?',['Repeat the same topic with the same full template','Ask students to argue a new topic using only a brief success-criteria checklist','Give a multiple-choice quiz on the template labels'],1,'A novel prompt with reduced support tests generative application of the writing skill.')}`,
()=>`<h2>Build a coherent lesson sequence</h2><div class="steps"><div class="step">Diagnose</div><div class="step">Model</div><div class="step">Guide & check</div><div class="step">Transfer & fade</div></div><p>Write the target performance first. Decide what evidence will show success, then select supports that address specific barriers.</p>${q('l10b','Which lesson plan is most coherent?',['Start with a visually engaging activity, then decide what students learned','Define an independent explanation goal, anticipate barriers, model reasoning, collect checks, and test transfer','Prepare detailed sentence frames and keep them throughout every task'],1,'Backward planning aligns support, formative evidence, and independent performance.')}`,
()=>`<h2>Expert case: competing good decisions</h2><p>Grade 9 learners can explain a science process using a labeled diagram, but half fail when the diagram is removed. There are 12 minutes left in the lesson.</p>${q('l10c','What is the strongest next instructional decision?',['Keep the labeled diagram for all learners and assign independent work next week','Use a partially labeled diagram for a brief guided comparison, then collect a short unsupported explanation from each learner','Remove the diagram immediately and grade the remaining explanations as a summative test'],1,'A brief intermediate fade plus an individual transfer check balances remaining time, access, and diagnostic evidence.')}`,
()=>`<h2>Expert case: choosing a scaffold</h2><p>An IELTS learner produces accurate extended answers with a frame but memorizes identical phrases across unrelated prompts.</p>${q('l10d','Which adaptation best promotes authentic speaking?',['Provide more sophisticated scripts for each topic','Use variable cue words and follow-up questions that require personal reasons and fresh examples','Keep the original frame because length is the primary success indicator'],1,'Flexible prompts and unanticipated follow-ups test communicative flexibility rather than scripted fluency.')}`,
()=>`<h2>Commit to one classroom improvement</h2><p>Use your final action plan to specify: the learning objective, likely barrier, selected scaffold, fading rule, and independent evidence. Then take the existing 10-question knowledge assessment.</p>${q('l10e','What is the clearest evidence that scaffolding has succeeded?',['Students complete the teacher’s model accurately','Students can independently apply the target skill in a new context and explain their choices','Students report that the lesson felt easier'],1,'The intended outcome is independent, transferable competence—not permanent dependence on support.')}`
]
];
const finalQ=[
['What best defines instructional scaffolding?',['Permanent assistance','Temporary support toward independence','Simpler objectives for all students','Giving students answers'],1,'Support is purposeful and temporary.'],
['A class stays silent after a question. What is a useful first response?',['Demand an immediate answer','Answer it yourself','Give thinking time, a frame, and rehearsal','Stop all oral questions'],2,'Provide processing and language support.'],
['Students must explain a water filter without any example. What is missing?',['Science vocabulary alone','A longer worksheet','An unrelated warm-up','Modeling and language/process support'],3,'Make the task and language accessible.'],
['“Are you working alone or with a partner?” is a…',['CCQ','ICQ','Final assessment','Vocabulary test'],1,'It checks the grouping instruction.'],
['Which sequence supports gradual release?',['Independent → model → guided','Model → guided → partner → independent','Partner → test → model','Independent → independent → independent'],1,'Responsibility is transferred progressively.'],
['Students cannot organize an IELTS essay. Which scaffold fits best?',['Longer vocabulary quiz','Complete essay to memorize','Claim–reason–example organizer','Shorter time limit'],2,'The organizer supports structure.'],
['Students solve numerical ratios but not English word problems. What should you investigate?',['Only arithmetic','Only pronunciation','Whether the class needs a test','Language demands versus mathematical understanding'],3,'Identify the barrier before choosing support.'],
['Why is “Do you understand?” a weak check?',['It collects no demonstration of understanding','It is always grammatically incorrect','It is an ICQ','It checks all concepts thoroughly'],0,'Ask for evidence, not a yes/no self-report.'],
['Students perform successfully with minimal prompts. What next?',['Keep full frames forever','Remove all support at once','Reduce support gradually and monitor','Give another full model automatically'],2,'Fade support based on readiness.'],
['IELTS answers remain one sentence. What is the strongest response?',['Tell students to speak longer','Model answer–reason–example and fade it','Skip to harder questions','Provide memorized answers for every topic'],1,'Model structure without creating dependence.']
];function openFinal(){state.screen='final';render()}function finalPage(){let done=Object.keys(state.finalAnswers).length;chrome(`${nav()}<section class="panel"><div class="eyebrow">Final assessment · 10 questions</div><h1>Show what you know</h1><p>Choose one answer for each question. Your practice activities do not count toward this score. Passing target: <strong>8 out of 10 (80%)</strong>.</p><div class="progress"><div class="bar" style="width:${done*10}%"></div></div><p class="muted">${done}/10 answered</p>${finalQ.map((q,i)=>`<div class="question"><h3>${i+1}. ${q[0]}</h3><div class="options">${q[1].map((o,j)=>`<button class="option ${state.finalAnswers[i]===j?'selected':''}" onclick="finalAnswer(${i},${j})" ${state.submitted?'disabled':''}>${String.fromCharCode(65+j)}. ${o}</button>`).join('')}</div>${state.submitted?`<div class="feedback ${state.finalAnswers[i]===q[2]?'':'try'}"><strong>${state.finalAnswers[i]===q[2]?'✓ Correct':'Correct answer: '+String.fromCharCode(65+q[2])}</strong> — ${q[3]}</div>`:''}</div>`).join('')}<div class="nav no-print">${state.submitted?`<button onclick="retryFinal()">Retry assessment</button><button class="primary" onclick="showResults()">View results →</button>`:`<button class="primary" ${done<10?'disabled':''} onclick="submitFinal()">Submit all 10 answers</button>`}</div></section>`)}function finalAnswer(i,j){if(state.submitted)return;state.finalAnswers[i]=j;persist();render()}function submitFinal(){if(Object.keys(state.finalAnswers).length<10)return;state.score=finalQ.filter((q,i)=>state.finalAnswers[i]===q[2]).length;state.submitted=true;persist();showResults()}function retryFinal(){state.finalAnswers={};state.submitted=false;state.score=0;persist();openFinal()}function showResults(){state.screen='results';render()}function results(){let passed=state.submitted&&state.score>=8;chrome(`${nav()}<section class="panel"><div class="eyebrow">Assessment results</div><h1>${passed?'Knowledge assessment passed':'Keep learning — you can retry'}</h1><div class="score">${state.score}/10 · ${state.score*10}%</div><p>${passed?'Well done. Now choose one classroom improvement and complete your action plan.':'Review your answers and the lessons, then try the assessment again. This is a learning opportunity, not a formal appraisal.'}</p><div class="nav no-print"><button onclick="openFinal()">Review answers</button><button onclick="retryFinal()">Retry assessment</button>${passed?'<button class="primary" onclick="openPlan()">Create my teaching action plan →</button>':''}</div></section>`)}function openPlan(){if(!state.submitted||state.score<8){showResults();return}state.screen='plan';render()}function updatePlan(k,v){state.plan[k]=v;persist()}function planPage(){let p=state.plan;chrome(`${nav()}<section class="panel"><div class="eyebrow">Practical application · your next lesson</div><h1>One change I will make</h1><p>Choose one realistic instructional improvement. You can print this page or save it as a PDF using your browser's print dialog.</p><label for="pname">Teacher name (optional)</label><input id="pname" class="input" value="${esc(p.name)}" oninput="updatePlan('name',this.value)"><label for="psubject">Target class or subject</label><input id="psubject" class="input" value="${esc(p.subject)}" placeholder="e.g., Grade 8 Science" oninput="updatePlan('subject',this.value)"><label for="pstrategy">Scaffolding strategy I will use</label><textarea id="pstrategy" class="input" placeholder="e.g., Model a cause-and-effect explanation, then use sentence frames." oninput="updatePlan('strategy',this.value)">${esc(p.strategy)}</textarea><label for="pevidence">How I will check whether it helped students</label><textarea id="pevidence" class="input" placeholder="e.g., Collect a short independent explanation from every student." oninput="updatePlan('evidence',this.value)">${esc(p.evidence)}</textarea><div class="nav no-print"><button class="primary" onclick="completePlan()">Save plan & complete course ✓</button></div><p class="footer">Completion requires passing the knowledge check and completing the classroom action plan. This record does not independently verify classroom implementation.</p></section>`)}function completePlan(){const p=state.plan;if(!p.subject.trim()||!p.strategy.trim()||!p.evidence.trim()){alert('Please complete the target class, strategy, and evidence fields.');return}state.date=new Date().toLocaleDateString();persist();state.screen='complete';render()}function completion(){let p=state.plan;chrome(`<section class="panel"><div class="eyebrow">IEC internal professional development</div><h1>Module 01 completed ✓</h1><p><strong>Effective Scaffolding — Learn It. Try It. Teach It.</strong></p><div class="score">${state.score*10}%</div><p><strong>Teacher:</strong> ${esc(p.name||'Not provided')}<br><strong>Completion date:</strong> ${esc(state.date)}<br><strong>Lessons:</strong> ${state.completed.length}/10 reviewed<br><strong>Knowledge assessment:</strong> ${state.score}/10</p><div class="callout"><strong>My next classroom action</strong><p><strong>Class:</strong> ${esc(p.subject)}</p><p><strong>Strategy:</strong> ${esc(p.strategy)}</p><p><strong>Evidence:</strong> ${esc(p.evidence)}</p></div><p class="footer">This is an IEC internal self-study completion summary, not an externally accredited certificate or independent verification of teaching competency.</p><div class="nav no-print"><button class="primary" onclick="window.print()">Print / save as PDF</button><button onclick="goHome()">Return to course</button></div></section>`)}function render(){if(state.screen==='home')home();else if(state.screen==='lesson')lessonPage();else if(state.screen==='final')finalPage();else if(state.screen==='results')results();else if(state.screen==='plan')planPage();else if(state.screen==='complete')completion()}render();
</script></body></html>
